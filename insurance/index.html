['Tras recibir una notificación de modificación del seguro colectivo, ¿en qué plazo puede renunciar el asegurado según el artículo 517?',['Cinco días','Diez días','Treinta días','Un año'],1,'La evaluación identifica diez días desde la notificación de modificación para ejercer la renuncia.'],
['¿Cuándo debe informarse una agravación sustancial del riesgo ocurrida después de contratar el seguro?',['Nunca hay obligación de informar','En los cinco días siguientes al conocimiento, en el supuesto legal descrito','Solo al ocurrir el siniestro','Después de renovar dos veces'],1,'El artículo 526 contiene obligaciones de comunicar agravaciones sustanciales y establece supuestos y plazos específicos.'],
['¿Se aplica sin excepciones el régimen de agravación del riesgo del artículo 526 a todos los seguros de personas?',['Sí, no existe ninguna excepción','No, la normativa contempla excepciones para seguros de personas','Solo a seguros de vida temporal','Únicamente a seguros de invalidez'],1,'La respuesta del cuestionario indica excepciones en el tratamiento de agravación del riesgo en seguros de personas.'],
['Respecto de un siniestro declarado, ¿qué establece el artículo 531 sobre la prueba de cobertura?',['El asegurador jamás puede cuestionar la causa del daño','Se presume que el siniestro ocurrió por un hecho que hace responsable al asegurador, pero este puede acreditar lo contrario','El asegurado pierde siempre su derecho al declarar','Solo se cubre si no existen testigos'],1,'El artículo 531 contiene una presunción favorable a la cobertura y permite al asegurador probar una causa no cubierta.'],
['Si varias causas concurren a producir un siniestro y alguna corresponde a un riesgo cubierto, ¿qué indica el artículo 533?',['Solo se indemniza cuando todas las causas están cubiertas','Se responde si entre las causas concurrentes existe un riesgo cubierto, según las condiciones legales','Nunca se indemnizan siniestros con múltiples causas','El asegurado siempre debe pagar el daño íntegro'],1,'La evaluación destaca la regla de causas concurrentes del artículo 533.'],
['Además de pagar la prima y declarar el riesgo, ¿qué deber de cuidado tiene el asegurado respecto de la cosa asegurada?',['Ninguno en ningún caso','Emplear el cuidado y celo de un buen padre de familia','Delegar todo cuidado al corredor','Modificar unilateralmente la póliza'],1,'El artículo 524 incluye obligaciones de conservación y cuidado de la materia asegurada.'],
['Si una póliza establece que el asegurado asume siempre los primeros $500.000 de cada siniestro, ¿qué representa ese monto?',['Deducible','Sobreseguro','Dejación','Prima devengada'],0,'Es la parte de la pérdida que queda a cargo del asegurado, según lo pactado.'],
['Sobre el devengo de la prima, ¿qué señala la evaluación del artículo 527?',['Se gana únicamente al finalizar la póliza','El asegurador gana la prima desde que comienza a correr el riesgo, devengándose proporcionalmente al tiempo en coberturas a plazo','La prima nunca puede expresarse en algo distinto de dinero','No se devenga si no existe siniestro'],1,'El artículo 527 regula el devengo de la prima; en contratos por tiempo determinado se considera la proporción del período transcurrido.'],
['Si una persona contrata directamente un seguro sin corredor, ¿qué deber del asegurador destaca el artículo 529?',['No proporcionar ninguna información','Prestar asesoría y asistencia durante vigencia, modificaciones, renovación y siniestro','Responder por riesgos expresamente excluidos','Indemnizar cualquier daño sin revisar el contrato'],1,'El artículo 529 establece deberes de asesoría y asistencia para contratación directa, además de la obligación de cubrir los riesgos pactados.'],
['¿Qué diferencia establece el artículo 513 entre asegurado, beneficiario y contratante?',['Deben ser siempre la misma persona','El asegurado soporta el riesgo, el beneficiario puede tener derecho a la prestación y el contratante celebra el contrato','El beneficiario siempre paga la prima','El contratante es necesariamente el único expuesto al riesgo'],1,'El Código distingue los tres roles, que pueden o no coincidir en una misma persona.']
];
const LEGISLACION_DATA=[...LEGISLACION.map((q,i)=>({id:`L-O${String(i+1).padStart(2,'0')}`,q:q[0],a:q[1],correct:q[2],why:q[3],origin:'evaluación Legislación I · Código de Comercio'})),...LEGISLACION_NUEVAS.map((q,i)=>({id:`L-N${String(i+1).padStart(2,'0')}`,q:q[0],a:q[1],correct:q[2],why:q[3],origin:'Evaluación Parcial Módulo I · segundo archivo'}))];
const app=document.getElementById('app');let state={page:'access',subject:'Vida',mode:'practice',questions:[],index:0,answers:{},revealed:{}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const btn=(text,act,kind='primary')=>`<button class="${kind}" data-act="${act}">${text}</button>`;
function render(){let p=state.page;if(p==='access'){app.innerHTML=`<section class="card"><span class="pill">ACCESO PRIVADO</span><h1>Bienvenido a Insurance</h1><p class="muted">Plataforma de entrenamiento en seguros con preguntas de selección múltiple.</p><label for="code">Código de acceso</label><p><input class="input" id="code" type="password" autocomplete="off" placeholder="Ingresa tu código"></p><p class="small" id="error" style="color:#b93838"></p><div class="actions">${btn('Ingresar','login')}</div><p class="warning">Acceso de demostración: la contraseña es una barrera visual, no un sistema de seguridad para datos sensibles.</p></section>`;return}
if(p==='subject'){app.innerHTML=`<section class="card"><span class="pill">MOINEM INSURANCE</span><h1>¿Qué materia quieres estudiar?</h1><div class="grid"><button class="tile" data-act="chooseLegislacion"><strong>Legislación</strong><span class="muted">${LEGISLACION_DATA.length} preguntas disponibles</span></button><button class="tile" data-act="chooseGenerales"><strong>Generales</strong><span class="muted">${GENERAL_DATA.length} preguntas disponibles</span></button><button class="tile" data-act="chooseVida"><strong>Vida</strong><span class="muted">${DATA.length} preguntas disponibles</span></button></div><p class="small muted">Legislación: ${LEGISLACION_DATA.length} · Generales: ${GENERAL_DATA.length} · Vida: ${DATA.length} preguntas.</p></section>`;return}
if(p==='mode'){const bank=state.subject==='Vida'?DATA:state.subject==='Generales'?GENERAL_DATA:LEGISLACION_DATA;app.innerHTML=`<section class="card"><span class="pill">MÓDULO ${esc(state.subject.toUpperCase())}</span><h1>Elige tu modalidad</h1><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="tile" data-act="practice"><strong>Modo Práctica</strong><span class="muted">Comprueba la respuesta y lee su explicación después de contestar.</span></button><button class="tile" data-act="exam"><strong>Modo Examen</strong><span class="muted">La corrección aparecerá solamente al terminar.</span></button></div><p class="warning">${bank.length<30?`Este banco contiene ${bank.length} preguntas y se mostrarán todas, sin repetir. Cuando lleguemos a 30 o más, se seleccionarán 30 al azar.`:`Se seleccionan 30 preguntas sin repetición de un banco de ${bank.length}.`} Las afirmaciones dependientes de una póliza se presentan según el material original, no como reglas universales.</p><div class="actions">${btn('Volver','subjects','secondary')}</div></section>`;return}
if(p==='quiz'){const q=state.questions[state.index],v=state.answers[q.id],has=v!==undefined,rev=!!state.revealed[q.id];app.innerHTML=`<section class="card"><span class="pill">${esc(state.subject.toUpperCase())} · ${state.mode==='practice'?'PRÁCTICA':'EXAMEN'}</span><p class="muted small">Pregunta ${state.index+1} de ${state.questions.length} · ${esc(q.origin)}</p><div class="progress"><div style="width:${(state.index+1)/state.questions.length*100}%"></div></div><h2>${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${has&&v===i?'active':''} ${rev&&i===q.correct?'correct':''} ${rev&&v===i&&i!==q.correct?'wrong':''}" data-answer="${i}" ${has?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>${rev?`<div class="feedback"><strong>${v===q.correct?'✓ ¡Correcto!':'Respuesta incorrecta'}</strong><p>Respuesta: <strong>${esc(q.options[q.correct])}</strong></p><p>${esc(q.why)}</p></div>`:''}<div class="actions">${state.mode==='practice'&&has&&!rev?btn('Ver respuesta','reveal','secondary'):''}${state.index>0?btn('Volver a la anterior','prev','secondary'):''}${state.index<state.questions.length-1?btn('Siguiente','next'):btn('Finalizar y ver resultados','finish')}${btn('Volver a modalidades','backMode','secondary')}</div><p class="small muted">Puedes retroceder y revisar preguntas ya contestadas. Las respuestas quedan fijadas al seleccionar una alternativa. Si sales a modalidades, el intento actual terminará.</p></section>`;return}
if(p==='results'){let total=state.questions.length,ok=state.questions.filter(q=>state.answers[q.id]===q.correct).length,answered=Object.keys(state.answers).length;app.innerHTML=`<section class="card"><span class="pill">RESULTADOS · ${state.mode==='practice'?'PRÁCTICA':'EXAMEN'}</span><h1>Resultado de tu evaluación</h1><div class="stat">${Math.round(ok/total*100)}%</div><p><strong>${ok}</strong> correctas · <strong>${total-ok}</strong> incorrectas o sin responder · <strong>${answered}</strong> respondidas · <strong>${total}</strong> preguntas</p><div class="actions">${btn('Nuevo intento','restart')}${btn('Cambiar modalidad','mode','secondary')}${btn('Revisar respuestas','review','secondary')}</div></section>`;return}
if(p==='review'){app.innerHTML=`<section class="card"><span class="pill">REVISIÓN</span><h1>Respuestas y explicaciones</h1>${state.questions.map((q,i)=>{const v=state.answers[q.id];return `<div class="review"><strong>${i+1}. ${esc(q.q)}</strong><p class="small">Tu respuesta: ${v===undefined?'Sin responder':esc(q.options[v])} · <b style="color:${v===q.correct?'#20814b':'#b34337'}">${v===q.correct?'Correcta':'Incorrecta'}</b></p><p class="small">Respuesta correcta: <b>${esc(q.options[q.correct])}</b></p><p class="muted small">${esc(q.why)}</p></div>`}).join('')}<div class="actions">${btn('Volver a resultados','results')}${btn('Nuevo intento','restart','secondary')}</div></section>`}}
function start(mode){state.mode=mode;const bank=state.subject==='Vida'?DATA:state.subject==='Generales'?GENERAL_DATA:LEGISLACION_DATA;let picked=shuffle(bank).slice(0,Math.min(30,bank.length));state.questions=picked.map(q=>{let order=shuffle([0,1,2,3]);return {...q,options:order.map(i=>q.a[i]),correct:order.indexOf(q.correct)}});state.index=0;state.answers={};state.revealed={};state.page='quiz';render()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'),answer=e.target.closest('[data-answer]');if(answer){let q=state.questions[state.index];if(state.answers[q.id]===undefined){state.answers[q.id]=Number(answer.dataset.answer);render()}return}if(!a)return;switch(a.dataset.act){case 'login':if(document.getElementById('code').value.trim()==='Pablo Moraga'){state.page='subject';render()}else document.getElementById('error').textContent='Código incorrecto';break;case 'chooseVida':state.subject='Vida';state.page='mode';render();break;case 'chooseGenerales':state.subject='Generales';state.page='mode';render();break;case 'chooseLegislacion':state.subject='Legislación';state.page='mode';render();break;case 'subjects':state.page='subject';render();break;case 'practice':start('practice');break;case 'exam':start('exam');break;case 'reveal':state.revealed[state.questions[state.index].id]=true;render();break;case 'prev':state.index--;render();break;case 'next':state.index++;render();break;case 'backMode':if(confirm('¿Salir del intento actual? Las respuestas de esta sesión se perderán.')){state.page='mode';render()}break;case 'finish':state.page='results';render();break;case 'review':state.page='review';render();break;case 'results':state.page='results';render();break;case 'restart':start(state.mode);break;case 'mode':state.page='mode';render();break}});render();
</script></body></html>
