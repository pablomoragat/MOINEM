name: Replace contact photo

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  replace-contact-photo:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace only contact photo source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://images.pexels.com/photos/7433875/pexels-photo-7433875.jpeg?auto=compress&dpr=1&h=750&w=1260'
          new = 'imagenes/contacto/moinem_contact_team.jpg'
          if old not in s:
              raise SystemExit('Current contact image URL not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/replace-contact-photo.yml

      - name: Commit replacement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/replace-contact-photo.yml
          git commit -m "Reemplaza foto de contacto por equipo ejecutivo"
          git push
