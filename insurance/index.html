<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOINEM | Insurance</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#162638;background:#f2f6fa}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.5}header{background:#102d48;color:white;padding:20px max(24px,calc((100vw - 1050px)/2));display:flex;align-items:center;justify-content:space-between}header span{font-size:12px;letter-spacing:.17em;color:#a9c9de}header strong{display:block;font-size:22px;letter-spacing:.04em}main{max-width:950px;margin:45px auto;padding:0 20px 80px}.card{background:white;border:1px solid #dbe5ec;border-radius:18px;padding:30px;box-shadow:0 12px 40px #17324c0c}.muted{color:#64788a}.small{font-size:13px}.pill{display:inline-block;background:#e7f2f9;border-radius:25px;padding:7px 12px;color:#1b5d80;font-size:13px;font-weight:700}h1{font-size:33px;margin:14px 0 12px}h2{font-size:23px;margin:4px 0 16px}p{line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.primary,.secondary{padding:12px 18px;border-radius:10px;border:1px solid #145f87;font-weight:650}.primary{background:#116589;color:white}.secondary{background:white;color:#116589}.options{display:grid;gap:10px;margin-top:22px}.option{width:100%;text-align:left;border:1px solid #d4e0e8;background:#fcfdff;color:#24374a;border-radius:12px;padding:16px}.option:hover{border-color:#2882a8}.option.active{background:#e7f5fc;border:2px solid #16749c}.option.correct{background:#e5f8ec;border-color:#238352}.option.wrong{background:#fff0ec;border-color:#b94433}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.tile{border:1px solid #cfdfea;border-radius:13px;padding:22px;background:#f9fbfc;text-align:left;min-height:130px}.tile strong{font-size:19px;display:block;margin-bottom:9px}.tile:disabled{background:#f0f1f2}.progress{height:9px;background:#e9eef1;border-radius:8px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:#1784a7;transition:width .2s}.feedback{padding:17px;border-radius:12px;background:#f0f6fa;margin-top:16px;line-height:1.55}.stat{font-size:42px;font-weight:800;color:#116589}.review{border-top:1px solid #e5edf3;padding:18px 0}.review p{margin:7px 0}.input{width:100%;max-width:400px;padding:13px;border:1px solid #b9cbd9;border-radius:9px}.floating{position:fixed;bottom:10px;left:12px;opacity:.3;background:#102d48;color:white;border:0;border-radius:8px;padding:8px 12px;font-size:12px}.floating:hover,.floating:focus{opacity:1}.warning{border-left:4px solid #d2a143;background:#fff9e9;padding:13px;margin:17px 0;font-size:14px}.hide{display:none!important}@media(max-width:680px){.grid{grid-template-columns:1fr}.card{padding:22px}main{margin:22px auto}h1{font-size:27px}header{padding:18px 20px}}
</style></head><body>
<header><div><span>MOTOR DE INTELIGENCIA EMPRESARIAL</span><strong>MOINEM <span style="letter-spacing:normal;color:#77d3ed;font-size:20px">Insurance</span></strong></div><span>ENTRENAMIENTO</span></header>
<main id="app" aria-live="polite"></main><a class="floating" id="home" href="../index.html" title="Volver a MOINEM" style="text-decoration:none">Volver a MOINEM</a>
<script>
const ORIGINAL=[
['¿Qué es un contrato de seguros de vida?',['Transferir el riesgo a cambio del pago de una prima.','Es un acuerdo entre dos partes por un bien común','Es endosar el riesgo a un tercero','Es un mutuo acuerdo'],0,'El seguro transfiere al asegurador un riesgo definido a cambio de una prima.'],
['¿Se debe informar sobre la existencia de otros seguros vigentes?',['No es necesario','Cuando se requiera','Sí, detallando las condiciones particulares de la póliza y de aceptación del riesgo','Solo si el asegurado así lo estima'],2,'La evaluación de origen exige informar otros seguros vigentes y sus condiciones.'],
['¿Qué es un deducible?',['Monto pactado en la póliza que se descuenta de la indemnización','Monto descontado de las primas pagadas','Monto que paga el asegurador','Monto que nunca se cancela'],0,'El deducible es la parte del siniestro que queda a cargo del asegurado según el contrato.'],
['La eventualidad de un suceso, ¿qué representa?',['El riesgo','El costo','El pago','Un incidente'],0,'El riesgo se relaciona con la posibilidad de que ocurra un evento incierto.'],
['Según la evaluación, ¿qué situación podría justificar que la aseguradora no pague una indemnización?',['Participación del asegurado en actos terroristas','Suicidio después de dos años','Fallecimiento por razones naturales','Muerte por causas externas'],0,'Una exclusión debe constar en la póliza y ajustarse a la normativa. La respuesta corresponde al caso planteado en el material.'],
['¿Qué documento da cuenta de un seguro tomado?',['Certificado de cobertura','La propuesta','Mandato PAC activo','Declaración de salud'],0,'En esta pregunta del material, el certificado de cobertura acredita el seguro tomado.'],
['¿Qué es un endoso a la póliza?',['Una notificación de datos sin efecto contractual','Una nueva póliza','Una modificación escrita de la póliza','Un aviso de domicilio del asegurador'],2,'El endoso documenta modificaciones de las condiciones del contrato.'],
['¿Qué ley modificó la regulación chilena del contrato de seguro?',['Ley 20.667','Ley 19.728','Ley 18.940','Decreto Ley 3.500'],0,'La Ley 20.667 modificó las normas sobre contrato de seguro del Código de Comercio.'],
['Según la evaluación, ¿cuándo se rehabilita una póliza?',['Cuando deja de estar vigente por falta de pago y se regularizan primas pendientes','Cuando caduca por requerimientos médicos','Cuando no se activa la forma de pago','Cuando falta información para la compañía'],0,'La rehabilitación depende de las condiciones pactadas y de la aceptación de la compañía; pagar puede no bastar automáticamente.'],
['¿Qué es la póliza?',['Documento que acredita y contiene las condiciones del seguro','La propuesta firmada por el asegurado','Únicamente una regulación del seguro de vida','Documento solo para uso del asegurador'],0,'La póliza es el documento del contrato de seguro y sus condiciones.'],
['Según la evaluación, ¿cuándo comienza la vigencia de la póliza?',['Cuando se acepta el riesgo y se emite la póliza','Al firmar cualquier documento','Solo al pagar la prima','Cuando el asegurado acepta su propia propuesta'],0,'Es la respuesta del material de origen; en la práctica prevalece la fecha de inicio pactada y las condiciones de cobertura.'],
['Según la evaluación, ¿en cuál situación puede terminarse el contrato?',['Ausencia de interés asegurable o falta de pago de primas','Capital demasiado alto, sin más','Por cualquier deducible','Cuando la compañía lo estime conveniente'],0,'El término del contrato requiere causal contractual o legal; no es discrecional.'],
['¿Es válido celebrar un seguro a distancia?',['Sí, si cumple los requisitos normativos','Solo con firma manuscrita original','Nunca','Solo con firmas escaneadas'],0,'La contratación a distancia puede ser válida si se cumplen las exigencias legales.'],
['Según la tabla de invalidez considerada en la evaluación, ¿qué pérdida corresponde al 100%?',['Ambas manos','Ambos oídos','Una mano o un pie','Un ojo'],0,'Esta respuesta depende de la tabla y cobertura particular de la póliza del ejercicio.'],
['En la cobertura de invalidez accidental del material, ¿cuál es la edad límite indicada?',['Antes de 60 años','Antes de 61 años','Antes de 65 años','Antes de 70 años'],2,'Este límite pertenece al producto evaluado; no es una regla universal de seguros.'],
['En la modalidad A de la cobertura oncológica del ejercicio, ¿dónde debe atenderse el asegurado?',['En cualquier institución extranjera','En las instituciones designadas por la compañía','Donde quiera sin instrucciones','Siempre en un hospital público'],1,'La modalidad A del ejercicio restringe la red de atención conforme a la póliza.'],
['Según la evaluación, ¿cuál es el plazo de retracto señalado tras recibir la póliza de vida?',['10 días','Sin límite','6 meses','No existe retracto'],0,'El material señala 10 días; hay que comprobar la regulación y las condiciones aplicables antes de usarlo como regla general.'],
['En la cobertura de invalidez natural del material, ¿qué edad límite se señala?',['Antes de 60 años','Antes de 61 años','Antes de 65 años','Antes de 70 años'],0,'Este límite corresponde a las condiciones particulares del ejercicio.'],
['¿Quién es el asegurado?',['El contratante necesariamente','El pagador necesariamente','La persona expuesta al riesgo transferido al asegurador','El cónyuge necesariamente'],2,'Asegurado es quien está expuesto al riesgo cubierto. Puede coincidir o no con el contratante.'],
['Según la recomendación comercial del material, ¿qué máximo de capital respecto de la renta se sugiere?',['10 veces la renta','20 veces la renta','30 veces la renta','15 veces la renta'],0,'Es una recomendación del ejercicio, no un máximo legal general.'],
['¿Quién es el contratante?',['Quien soporta necesariamente el riesgo','Quien celebra el seguro y asume las obligaciones del contrato','Siempre el asegurado','Quien recibe la indemnización'],1,'El contratante suscribe el contrato y asume las obligaciones correspondientes.']
];
const DERIVED=[
['¿Cuál es la contraprestación que el contratante paga para obtener cobertura?',['Deducible','Prima','Indemnización','Endoso'],1,'La prima es el precio del seguro.'],
['¿Cuál concepto identifica la suma que el asegurador paga ante un siniestro cubierto?',['Indemnización','Prima','Cotización','Deducible'],0,'La indemnización es la prestación a cargo del asegurador cuando corresponde cobertura.'],
['¿Cuál de estos documentos suele expresar las condiciones del contrato de seguro?',['Póliza','Mandato PAC','Publicidad','Boleta de honorarios'],0,'La póliza recoge las estipulaciones del seguro.'],
['¿Qué documento corresponde usar si se modifican las condiciones de una póliza vigente?',['Endoso','Nueva declaración de renta','Mandato bancario','Factura'],0,'El endoso registra cambios contractuales.'],
['¿Qué diferencia al asegurado del contratante?',['El asegurado soporta el riesgo; el contratante celebra el contrato','Son siempre personas distintas','El asegurado siempre paga la prima','El contratante siempre cobra indemnización'],0,'Los roles pueden coincidir, pero tienen definiciones distintas.'],
['¿Qué significa que dos personas coincidan como asegurado y contratante?',['Que la misma persona celebra el contrato y soporta el riesgo','Que el seguro sea inválido','Que no haya prima','Que no se necesite póliza'],0,'Los roles son compatibles y pueden recaer en una sola persona.'],
['¿Cuál es un ejemplo de un dato que puede ser modificado mediante un endoso?',['Condiciones o datos contractuales','La ley vigente en todo Chile','La existencia de los tribunales','La tasa de IVA nacional'],0,'El endoso modifica aspectos acordados de la póliza.'],
['¿Cuál afirmación describe mejor la contratación a distancia de seguros?',['Puede celebrarse respetando exigencias legales','Nunca tiene validez','No requiere consentimiento','Siempre elimina exclusiones'],0,'La validez no depende de una única modalidad presencial.'],
['¿Cuál es el propósito principal del deducible?',['Definir la parte de pérdida que asume el asegurado','Determinar la edad del beneficiario','Sustituir la prima','Eliminar el riesgo'],0,'La aplicación de un deducible reduce la suma a cargo de la compañía según contrato.'],
['¿Qué entidad supervisa el mercado de seguros en Chile?',['Comisión para el Mercado Financiero','Servicio Electoral','Banco Central Europeo','Ministerio de Vivienda'],0,'La CMF fiscaliza a las entidades aseguradoras en Chile.'],
['¿Cuál de estas afirmaciones sobre exclusiones es correcta?',['Deben revisarse en las condiciones de la póliza','Son idénticas en todos los seguros','Se aplican sin importar el contrato','Las decide el corredor después del siniestro'],0,'Las exclusiones dependen de los términos contractuales y del marco normativo.'],
['¿Una recomendación de capital asegurado equivale necesariamente a un límite legal?',['No; una recomendación comercial no es por sí misma un tope legal','Sí, siempre','Solo si aparece en un folleto','Sí, aunque no exista norma'],0,'Las recomendaciones orientan decisiones, pero no sustituyen los requisitos legales y contractuales.'],
['¿Los límites de edad de coberturas adicionales son iguales en todas las compañías?',['No; dependen de las condiciones de cada producto','Sí, todas las pólizas tienen los mismos','No existen límites de edad','Solo dependen de la prima'],0,'Los límites de edad requieren consultar las condiciones particulares y generales del producto.'],
['¿Qué debe comprobarse para saber cuándo comienza la cobertura real?',['La fecha de vigencia indicada en las condiciones de la póliza','Solo la fecha de publicidad','La fecha de cumpleaños','La fecha de inscripción del corredor'],0,'Los efectos contractuales dependen de las condiciones pactadas y requisitos de vigencia.'],
['¿El pago de una prima vencida rehabilita siempre y automáticamente una póliza caducada?',['No necesariamente; se deben revisar condiciones y aceptación de la compañía','Sí, siempre en cualquier seguro','Solo si se paga en efectivo','Solo si interviene un banco'],0,'La rehabilitación puede requerir condiciones adicionales según la póliza.'],
['¿Qué distingue a un certificado de cobertura de una declaración de salud?',['El primero acredita cobertura; la segunda aporta antecedentes de salud','Ambos son documentos idénticos','La declaración paga indemnizaciones','El certificado reemplaza toda póliza en cualquier caso'],0,'Sus finalidades son diferentes en el proceso de contratación.']
];
const DATA=[...ORIGINAL.map((q,i)=>({id:`V-O${String(i+1).padStart(2,'0')}`,q:q[0],a:q[1],correct:q[2],why:q[3],origin:'original'})),...DERIVED.map((q,i)=>({id:`V-D${String(i+1).padStart(2,'0')}`,q:q[0],a:q[1],correct:q[2],why:q[3],origin:'derivada'}))];
const app=document.getElementById('app');let state={page:'access',subject:'Vida',mode:'practice',questions:[],index:0,answers:{},revealed:{}};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>a.slice().sort(()=>Math.random()-.5);const btn=(text,act,kind='primary')=>`<button class="${kind}" data-act="${act}">${text}</button>`;
function render(){let p=state.page;if(p==='access'){app.innerHTML=`<section class="card"><span class="pill">ACCESO PRIVADO</span><h1>Bienvenido a Insurance</h1><p class="muted">Plataforma de entrenamiento en seguros con preguntas de selección múltiple.</p><label for="code">Código de acceso</label><p><input class="input" id="code" type="password" autocomplete="off" placeholder="Ingresa tu código"></p><p class="small" id="error" style="color:#b93838"></p><div class="actions">${btn('Ingresar','login')}</div><p class="warning">Acceso de demostración: la contraseña es una barrera visual, no un sistema de seguridad para datos sensibles.</p></section>`;return}
if(p==='subject'){app.innerHTML=`<section class="card"><span class="pill">MOINEM INSURANCE</span><h1>¿Qué materia quieres estudiar?</h1><div class="grid"><button class="tile" disabled><strong>Legislación</strong><span class="muted">Próximamente</span></button><button class="tile" disabled><strong>Generales</strong><span class="muted">Próximamente</span></button><button class="tile" data-act="chooseVida"><strong>Vida</strong><span class="muted">${DATA.length} preguntas disponibles</span></button></div><p class="small muted">Banco de Vida: ${ORIGINAL.length} preguntas del PDF y ${DERIVED.length} nuevas preguntas derivadas y revisadas.</p></section>`;return}
if(p==='mode'){app.innerHTML=`<section class="card"><span class="pill">MÓDULO VIDA</span><h1>Elige tu modalidad</h1><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><button class="tile" data-act="practice"><strong>Modo Práctica</strong><span class="muted">Comprueba la respuesta y lee su explicación después de contestar.</span></button><button class="tile" data-act="exam"><strong>Modo Examen</strong><span class="muted">La corrección aparecerá solamente al terminar.</span></button></div><p class="warning">Se seleccionan 30 preguntas sin repetición de un banco de ${DATA.length}. Las afirmaciones dependientes de una póliza se presentan como preguntas del material original, no como reglas universales.</p><div class="actions">${btn('Volver','subjects','secondary')}</div></section>`;return}
if(p==='quiz'){const q=state.questions[state.index],v=state.answers[q.id],has=v!==undefined,rev=!!state.revealed[q.id];app.innerHTML=`<section class="card"><span class="pill">VIDA · ${state.mode==='practice'?'PRÁCTICA':'EXAMEN'}</span><p class="muted small">Pregunta ${state.index+1} de ${state.questions.length} · ${q.origin==='original'?'Pregunta del material':'Pregunta nueva derivada'}</p><div class="progress"><div style="width:${(state.index+1)/state.questions.length*100}%"></div></div><h2>${esc(q.q)}</h2><div class="options">${q.options.map((o,i)=>`<button class="option ${has&&v===i?'active':''} ${rev&&i===q.correct?'correct':''} ${rev&&v===i&&i!==q.correct?'wrong':''}" data-answer="${i}" ${has?'disabled':''}>${'ABCD'[i]}. ${esc(o)}</button>`).join('')}</div>${rev?`<div class="feedback"><strong>${v===q.correct?'✓ ¡Correcto!':'Respuesta incorrecta'}</strong><p>Respuesta: <strong>${esc(q.options[q.correct])}</strong></p><p>${esc(q.why)}</p></div>`:''}<div class="actions">${state.mode==='practice'&&has&&!rev?btn('Ver respuesta','reveal','secondary'):''}${state.index>0?btn('Volver a la anterior','prev','secondary'):''}${state.index<state.questions.length-1?btn('Siguiente','next'):btn('Finalizar y ver resultados','finish')}${btn('Volver a modalidades','backMode','secondary')}</div><p class="small muted">Puedes retroceder y revisar preguntas ya contestadas. Las respuestas quedan fijadas al seleccionar una alternativa. Si sales a modalidades, el intento actual terminará.</p></section>`;return}
if(p==='results'){let total=state.questions.length,ok=state.questions.filter(q=>state.answers[q.id]===q.correct).length,answered=Object.keys(state.answers).length;app.innerHTML=`<section class="card"><span class="pill">RESULTADOS · ${state.mode==='practice'?'PRÁCTICA':'EXAMEN'}</span><h1>Resultado de tu evaluación</h1><div class="stat">${Math.round(ok/total*100)}%</div><p><strong>${ok}</strong> correctas · <strong>${total-ok}</strong> incorrectas o sin responder · <strong>${answered}</strong> respondidas · <strong>${total}</strong> preguntas</p><div class="actions">${btn('Nuevo intento','restart')}${btn('Cambiar modalidad','mode','secondary')}${btn('Revisar respuestas','review','secondary')}</div></section>`;return}
if(p==='review'){app.innerHTML=`<section class="card"><span class="pill">REVISIÓN</span><h1>Respuestas y explicaciones</h1>${state.questions.map((q,i)=>{const v=state.answers[q.id];return `<div class="review"><strong>${i+1}. ${esc(q.q)}</strong><p class="small">Tu respuesta: ${v===undefined?'Sin responder':esc(q.options[v])} · <b style="color:${v===q.correct?'#20814b':'#b34337'}">${v===q.correct?'Correcta':'Incorrecta'}</b></p><p class="small">Respuesta correcta: <b>${esc(q.options[q.correct])}</b></p><p class="muted small">${esc(q.why)}</p></div>`}).join('')}<div class="actions">${btn('Volver a resultados','results')}${btn('Nuevo intento','restart','secondary')}</div></section>`}}
function start(mode){state.mode=mode;let picked=shuffle(DATA).slice(0,Math.min(30,DATA.length));state.questions=picked.map(q=>{let order=shuffle([0,1,2,3]);return {...q,options:order.map(i=>q.a[i]),correct:order.indexOf(q.correct)}});state.index=0;state.answers={};state.revealed={};state.page='quiz';render()}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]'),answer=e.target.closest('[data-answer]');if(answer){let q=state.questions[state.index];if(state.answers[q.id]===undefined){state.answers[q.id]=Number(answer.dataset.answer);render()}return}if(!a)return;switch(a.dataset.act){case 'login':if(document.getElementById('code').value.trim()==='Pablo Moraga'){state.page='subject';render()}else document.getElementById('error').textContent='Código incorrecto';break;case 'chooseVida':state.page='mode';render();break;case 'subjects':state.page='subject';render();break;case 'practice':start('practice');break;case 'exam':start('exam');break;case 'reveal':state.revealed[state.questions[state.index].id]=true;render();break;case 'prev':state.index--;render();break;case 'next':state.index++;render();break;case 'backMode':if(confirm('¿Salir del intento actual? Las respuestas de esta sesión se perderán.')){state.page='mode';render()}break;case 'finish':state.page='results';render();break;case 'review':state.page='review';render();break;case 'results':state.page='results';render();break;case 'restart':start(state.mode);break;case 'mode':state.page='mode';render();break}});render();
</script></body></html>
